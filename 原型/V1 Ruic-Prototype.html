<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruic — Control Deck (prototype V1)</title>
<style>
:root{
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --bg:#0a0c0e; --panel:#101418; --panel2:#151b21; --line:#232b33; --line2:#33404b;
  --text:#e9edf0; --muted:#93a0aa; --dim:#66737d;
  --ac:#35d3c2; --ac-soft:rgba(53,211,194,.10); --ac-line:rgba(53,211,194,.38);
  --cr:#ff5f57; --hi:#ff9f45; --md:#e0c14f; --lo:#6fcf97;
  --r:9px; --sp:14px;
  --zwork-preview-accent:#35d3c2; --zwork-preview-font-family:var(--ui);
}
[data-theme="light"]{
  --bg:#f1f2ef; --panel:#ffffff; --panel2:#f7f8f5; --line:#e1e4df; --line2:#c8cdc7;
  --text:#11161a; --muted:#59646b; --dim:#7d888f;
  --ac:#0d8b7e; --ac-soft:rgba(13,139,126,.09); --ac-line:rgba(13,139,126,.4);
  --cr:#c8342c; --hi:#b8600f; --md:#8a6d10; --lo:#1f7a4d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100vh}
.rail{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.mark{width:26px;height:26px;border-radius:7px;background:var(--ac);color:#07110f;display:grid;place-items:center;font:700 13px var(--mono);flex:none}
.brand b{display:block;font:600 13px/1.1 var(--mono);letter-spacing:.16em}
.brand span{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-top:3px}
nav{padding:4px 8px;overflow:auto;flex:1}
.nav-g{font:600 9.5px var(--mono);letter-spacing:.14em;color:var(--dim);padding:12px 8px 5px}
.nav-i{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:6px;color:var(--muted);font-size:12.5px}
.nav-i:hover{background:var(--panel2);color:var(--text)}
.nav-i[aria-current="page"]{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--ac)}
.nav-i svg{flex:none;opacity:.85}
.nav-i .ct{margin-left:auto;font:600 10px var(--mono);color:var(--dim)}
.rail-foot{border-top:1px solid var(--line);padding:10px 10px 12px}
.crewmini{display:grid;gap:4px;margin-bottom:10px}
.cm{display:flex;align-items:center;gap:6px;font:500 10.5px var(--mono);color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--lo);flex:none}
.dot.warn{background:var(--md)} .dot.bad{background:var(--cr)} .dot.idle{background:var(--dim)}
.rail-foot .row{display:flex;gap:6px}

/* ---------- top bar ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:52px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.crumb{font:500 11px var(--mono);color:var(--dim);letter-spacing:.04em}
.crumb b{color:var(--text);font-weight:600}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--mono);letter-spacing:.04em;padding:4px 8px;border:1px solid var(--line2);border-radius:5px;color:var(--muted);background:var(--panel2);white-space:nowrap}
.chip.ac{color:var(--ac);border-color:var(--ac-line);background:var(--ac-soft)}
.chip.on{color:var(--ac);border-color:var(--ac-line)}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;background:none;border:1px solid transparent;border-radius:6px;color:var(--muted)}
.icon-btn:hover{background:var(--panel2);border-color:var(--line);color:var(--text)}
.icon-btn .bdg{position:absolute;transform:translate(9px,-8px);width:6px;height:6px;border-radius:50%;background:var(--hi)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font-size:12px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#06110f;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--cr);border-color:rgba(255,95,87,.4)}
.btn.sm{padding:4px 8px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- view ---------- */
.view{flex:1;overflow:auto;padding:20px 22px 48px}
.hd{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px}
.hd h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.hd p{margin:3px 0 0;color:var(--muted);font-size:12px;max-width:74ch}
.hd .grow{flex:1}
.grid{display:grid;gap:var(--sp)}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.split-r{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 13px;border-bottom:1px solid var(--line);min-height:42px}
.card-h h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.02em}
.card-h .grow{flex:1}
.card-b{padding:13px}
.card-b.tight{padding:0}
.note{color:var(--muted);font-size:11.5px;line-height:1.55;margin:0}
.why{display:flex;gap:7px;align-items:flex-start;margin:8px 0 0;padding:7px 9px;background:var(--panel2);border:1px dashed var(--line2);border-radius:6px;font-size:11px;color:var(--muted)}
.why b{color:var(--text);font-weight:600}
.stack{display:grid;gap:10px}
.tagl{font:600 9px/1 var(--mono);letter-spacing:.09em;padding:3px 5px;border-radius:3px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.tagl.live{color:var(--lo);border-color:rgba(111,207,151,.35)}
.tagl.partial{color:var(--md);border-color:rgba(224,193,79,.35)}
.tagl.gap{color:var(--ac);border-color:var(--ac-line);background:var(--ac-soft)}

/* ---------- metrics ---------- */
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;gap:1px}
.metric{background:var(--panel);padding:10px 12px}
.metric b{display:block;font:600 17px/1.2 var(--mono);letter-spacing:-.02em}
.metric span{display:block;font:500 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.metric em{font-style:normal;font-size:10px;color:var(--ac);font-family:var(--mono);margin-left:4px}

/* ---------- tables ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:11.5px}
.tbl th{text-align:left;font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--panel2);cursor:pointer}
.tbl .m{font-family:var(--mono);font-size:11px}
.tbl .dim{color:var(--dim)}
.tbl .nowrap{white-space:nowrap}
.sev{display:inline-flex;align-items:center;gap:6px;font:600 10px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.d{width:6px;height:6px;border-radius:50%;flex:none}
.critical .d,.d.critical{background:var(--cr)} .high .d,.d.high{background:var(--hi)}
.medium .d,.d.medium{background:var(--md)} .low .d,.d.low{background:var(--lo)}
.critical{color:var(--cr)} .high{color:var(--hi)} .medium{color:var(--md)} .low{color:var(--lo)}
.st{font:500 10px var(--mono);letter-spacing:.03em;padding:2px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.st.done{color:var(--lo);border-color:rgba(111,207,151,.3)} .st.active{color:var(--ac);border-color:var(--ac-line);background:var(--ac-soft)}
.st.fail{color:var(--cr);border-color:rgba(255,95,87,.35)} .st.open{color:var(--hi);border-color:rgba(255,159,69,.35)}

/* ---------- forms ---------- */
label.f{display:block;font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
input[type=text],input[type=search],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:12px;color:var(--text)}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:disabled,select:disabled{opacity:.55}
.inline{display:flex;gap:8px;align-items:center}
.inline .grow{flex:1}
.hint{font-size:10.5px;color:var(--dim);margin-top:4px}
.sw{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}
.sw:last-child{border-bottom:0}
.sw .grow{flex:1}
.sw small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px}
.tog{width:30px;height:17px;border-radius:9px;background:var(--line2);border:0;position:relative;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s}
.tog[aria-pressed="true"]{background:var(--ac)}
.tog[aria-pressed="true"]::after{transform:translateX(13px)}

/* ---------- phase rail ---------- */
.phases{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.ph{background:var(--panel2);border:1px solid var(--line);padding:8px 9px;border-radius:5px;min-width:0}
.ph b{display:block;font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ph span{display:block;font:500 9.5px var(--mono);color:var(--dim);margin-top:3px}
.ph.done{border-color:rgba(111,207,151,.3)} .ph.done b{color:var(--lo)}
.ph.cur{border-color:var(--ac-line);background:var(--ac-soft)} .ph.cur b,.ph.cur span{color:var(--ac)}
.ph.skip{opacity:.4}

/* ---------- misc panels ---------- */
.list{display:grid}
.row-i{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11.5px}
.row-i:last-child{border-bottom:0}
.row-i:hover{background:var(--panel2)}
.row-i .grow{flex:1;min-width:0}
.row-i .t{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.log{font:11px/1.75 var(--mono);padding:10px 12px;max-height:230px;overflow:auto;background:var(--panel2);border-radius:0 0 var(--r) var(--r)}
.log div{display:flex;gap:8px;white-space:pre-wrap}
.log time{color:var(--dim);flex:none}
.log .ty{color:var(--ac);flex:none}
.log .ty.w{color:var(--md)} .log .ty.e{color:var(--cr)}
.code{font:11px/1.7 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;overflow:auto;color:var(--muted);white-space:pre}
.diff{font:11px/1.65 var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:6px;overflow:auto;white-space:pre;margin:0}
.diff div{padding:0 10px}
.diff .del{background:rgba(255,95,87,.12);color:#ffb4ae}
.diff .add{background:rgba(111,207,151,.12);color:#9fe3bb}
.diff .ctx{color:var(--dim)}
.pill{font:500 10px var(--mono);padding:2px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
.frame{border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.frame-bar{display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--panel2);border-bottom:1px solid var(--line)}
.frame-bar .u{flex:1;font:10.5px var(--mono);color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:2px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mock{padding:22px;color:#1b2320;background:#fff;font-size:12px}
.mock h3{margin:0 0 6px;font-size:17px;color:#101614}
.mock .p{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #e6e8e4;font-size:11.5px}
.mock .b{display:inline-block;margin-top:12px;background:#0d8b7e;color:#fff;padding:6px 12px;border-radius:5px;font-size:11.5px}

/* ---------- filters ---------- */
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:5px;font:500 11px var(--mono);padding:4px 8px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--muted)}
.fchip:hover{color:var(--text)}
.fchip[aria-pressed="true"]{background:var(--ac-soft);border-color:var(--ac-line);color:var(--ac)}
.fchip i{font-style:normal;color:var(--dim);font-size:10px}
.search{position:relative;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 8px;min-width:180px}
.search svg{color:var(--dim);flex:none}
.search input{border:0;background:none;padding:6px 0;font-size:11.5px}
.search input:focus{outline:0}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .16s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);background:var(--panel);border-left:1px solid var(--line2);transform:translateX(101%);transition:transform .18s ease;z-index:41;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-size:14px}
.drawer-b{flex:1;overflow:auto;padding:16px}
.drawer-f{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:7px;flex-wrap:wrap}
.modal{position:fixed;top:14vh;left:50%;transform:translate(-50%,-8px);width:min(560px,94vw);background:var(--panel);border:1px solid var(--line2);border-radius:10px;z-index:42;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;box-shadow:0 24px 70px rgba(0,0,0,.5)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.modal .cmdin{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal .cmdin input{border:0;background:none;font-size:14px;padding:0}
.modal .cmdin input:focus{outline:0}
.cmdlist{max-height:52vh;overflow:auto;padding:6px}
.cmd-i{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:6px;font-size:12px;color:var(--muted);width:100%;background:none;border:0;text-align:left}
.cmd-i.sel{background:var(--ac-soft);color:var(--text)}
.cmd-i .k{margin-left:auto;font:10px var(--mono);color:var(--dim)}
.modal .foot{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font:10px var(--mono);color:var(--dim)}

/* ---------- toasts ---------- */
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:7px;z-index:50;max-width:340px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:2px solid var(--ac);border-radius:6px;padding:9px 12px;font-size:11.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:in .16s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

/* ---------- gap lens ---------- */
body.gaps .is-live{opacity:.38;filter:saturate(.4)}
body.gaps .is-live:hover{opacity:.9}
.legend{display:flex;gap:8px;align-items:center}
@media (max-width:1180px){
  .metrics{grid-template-columns:repeat(3,1fr)}
  .split,.split-r,.g3{grid-template-columns:1fr}
  .phases{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
  .g2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<a class="sr" href="#view">Skip to content</a>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="mark">R</span><div><b>RUIC</b><span>control deck</span></div></div>
    <nav id="nav" aria-label="Primary"></nav>
    <div class="rail-foot">
      <div class="crewmini" id="crewmini"></div>
      <div class="row">
        <button class="icon-btn" data-act="theme" aria-label="Toggle colour theme" title="Theme"></button>
        <button class="icon-btn" data-act="palette" aria-label="Command palette" title="Command palette (Ctrl K)"></button>
        <button class="icon-btn" data-act="shortcuts" aria-label="Keyboard shortcuts" title="Shortcuts (?)"></button>
        <span class="chip" id="ver" style="margin-left:auto">v1.0.0</span>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="crumb" id="crumb"></div>
      <div class="grow"></div>
      <button class="chip" data-act="gaps" id="gapsBtn" aria-pressed="false">Gap lens</button>
      <div class="legend" id="legend"></div>
      <button class="chip" id="runChip" data-act="nav" data-view="run"></button>
      <button class="icon-btn" data-act="palette" aria-label="Search and commands" id="searchBtn"></button>
      <button class="icon-btn" data-act="notif" aria-label="Notifications" id="notifBtn"></button>
      <button class="chip" data-act="help">Docs</button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim" data-act="close"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Detail"></aside>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
/* ================= data (sample run, labelled in the UI) ================= */

const RUN={id:'R-1042',brief:'Ship the checkout page for the EU storefront',goal:['npm run build passes','checkout renders in the sandbox preview','no critical findings at merge'],elapsed:401,tin:184320,tout:61480,files:14};
const TASKS=[

{id:'T-03',file:'src/checkout/render.ts',h:'eng-1',st:'active',dur:'02:20',a:1},
{id:'T-04',file:'src/api/orders.ts',h:'eng-3',st:'done',dur:'01:44',a:2},
{id:'T-05',file:'src/api/shipping.ts',h:'eng-2',st:'active',dur:'01:05',a:1},
{id:'T-06',file:'src/lib/token.ts',h:'eng-3',st:'done',dur:'00:47',a:1},

{id:'T-08',file:'src/ui/checkout.css',h:'eng-2',st:'done',dur:'00:39',a:1},
{id:'T-09',file:'src/lib/money.ts',h:'eng-3',st:'done',dur:'01:18',a:1},
{id:'T-10',file:'src/lib/tax.ts',h:'eng-2',st:'fail',dur:'00:31',a:3},
{id:'T-11',file:'tests/cart.spec.ts',h:'eng-1',st:'done',dur:'01:02',a:1},
{id:'T-12',file:'tests/api.spec.ts',h:'eng-3',st:'queued',dur:'—',a:0}];
const F=[
{id:'F-07',sev:'critical',rule:'SEC-004',file:'src/lib/token.ts',line:42,msg:'Hardcoded signing secret in token module',m:2,state:'open',block:1},
{id:'F-08',sev:'critical',rule:'SEC-001',file:'src/checkout/render.ts',line:88,msg:'eval() resolves price rules from untrusted input',m:2,state:'open',block:1},

      <p class="note">Missing on this screen: rule id (the bridge drops it even though the engine has it), auditor corroboration, blocking flag, evidence excerpt, suggested patch, suppression with an expiry, false-positive feedback, baseline/new-only mode, export, bulk actions.</p>
    </div>`,'live')}
    ${card('Rule coverage',`<div class="card-b tight">${RULES.map(r=>{const [id,name]=r.split(' ');const n=F.filter(f=>f.rule===id).length;return `<div class="row-i"><span class="m dim" style="width:58px">${id}</span><span class="grow">${name}</span><span class="t">${n?n+' finding'+(n>1?'s':''):'—'}</span></div>`}).join('')}</div>`,'gap',`<button class="btn sm" data-act="toast" data-msg="Custom rules are not in the build: the 7 rules are compiled into rules-impl.ts.">Add rule</button>`)}
  </div>
</div>`};

/*__VIEWS__*/
</script>
</body>
